# Used only by tests. It replaces src/main/resources/application.properties while tests run,
# so the tests use a throwaway file in "target" and never touch your real database.

# Used by @DataJpaTest
spring.datasource.url=jdbc:sqlite:target/test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Used by @SpringBootTest (the same file, created by DatabaseConfig)
app.database.folder=target
app.database.file=test.db

# Do not replace SQLite with an embedded database
spring.test.database.replace=none

spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Tables are created before the tests and dropped after them
spring.jpa.hibernate.ddl-auto=create-drop

# The scheduled job must not run during tests
app.sync.enabled=false