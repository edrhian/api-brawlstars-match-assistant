spring.application.name=brawlmatchstats

# Where the SQLite file lives. The folder is created at startup if it does not exist.
# ${user.home} is your user directory, e.g. C:/Users/you or /home/you
app.database.folder=${user.home}/brawlmatchstats
app.database.file=brawlmatchstats.db

# Hibernate needs the SQLite dialect from hibernate-community-dialects
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Creates the "players" and "battles" tables on startup if they are missing
# TODO: Use explicit schema scripts instead
spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false
spring.jpa.show-sql=false